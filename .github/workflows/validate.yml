name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run repository validation
        run: |
          python tests/validate_repository.py
          python -m unittest discover -s tests -p "test_*.py"
      - name: Install Perl test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libarchive-zip-perl libdbi-perl libdbd-sqlite3-perl libfile-slurp-perl libjson-xs-perl
      - name: Prepare LMS plugin load path
        run: |
          set -euo pipefail
          mkdir -p Plugins
          ln -s ../BlissMixerLab Plugins/BlissMixerLab
      - name: Run plugin regression tests
        run: prove -l tests

name: Essentia shadow SPI integration (research only)

on:
  pull_request:
    paths:
      - 'BlissMixerLab/EssentiaExactIdentity.pm'
      - 'BlissMixerLab/EssentiaShadowProbe.pm'
      - 'BlissMixerLab/EssentiaBoundedSnapshot.pm'
      - 'tests/essentia_*'
      - '.github/workflows/essentia-shadow-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

# Keep one native build per active PR; superseded commits need no duplicate build.
concurrency:
  group: native-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-shadow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout host research branch
        uses: actions/checkout@v4
      - name: Checkout pinned independent native provider (source only)
        uses: actions/checkout@v4
        with:
          repository: chrober/bliss-guidance-essentia
          ref: de72433d9c690e1aa46e973bbcca63691e959df8
          path: _native_essentia_provider
          persist-credentials: false
      - name: Install Perl SQLite test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbi-perl libdbd-sqlite3-perl
      - name: Build native shadow-only SPI provider
        run: cargo build --manifest-path _native_essentia_provider/Cargo.toml --bin bliss-guidance-essentia
      - name: Connect repository-local LMS namespace
        run: |
          mkdir -p Plugins
          ln -s ../BlissMixerLab Plugins/BlissMixerLab
      - name: Run actual frozen SQLite and native JSONL transcript integration
        env:
          ESSENTIA_SHADOW_PROVIDER_BIN: ${{ github.workspace }}/_native_essentia_provider/target/debug/bliss-guidance-essentia
        run: |
          set -euo pipefail
          prove -lv tests/essentia_bounded_snapshot.t tests/essentia_shadow_probe.t tests/essentia_exact_identity.t tests/essentia_exact_identity_sqlite.t
